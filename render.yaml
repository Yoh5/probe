# Render blueprint for the hosted demo. Nothing secret lives here: the AssemblyAI
# key is marked sync: false, so Render asks for it in its dashboard and it never
# enters the repository.
services:
  - type: web
    name: probe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    # The brief is read and validated at startup, so a server that answers here at
    # all is a server with an interview it can actually conduct.
    healthCheckPath: /api/interview
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Which AssemblyAI region the interviewer is created in, and which socket the
      # page is told to open. Both have to be the same one: an agent belongs to the
      # region it was made in, and left implicit that region is wherever the caller
      # happens to be. A server in Oregon then creates its interviewer in the US
      # while a candidate in Europe looks for it in the EU, and the session is
      # refused with "Agent not found" while every REST call answered 201 and 200.
      # Set this to the region your candidates are in - us or eu.
      - key: PROBE_REGION
        value: eu

# A note on storage, because it is a real trade and not an oversight.
#
# Interviews and invitations are written to disk, and a free instance has no
# persistent one: its filesystem is wiped when it redeploys or wakes from sleep.
# A candidate's link, and the report it produced, do not survive that. For a demo
# anyone can try end to end in one sitting, that is fine.
#
# To keep them, move to a paid instance and uncomment the three lines below - a
# disk is not available on the free plan:
#
#     plan: starter
#     envVars:
#       - key: PROBE_DATA
#         value: /var/probe
#     disk:
#       name: probe-data
#       mountPath: /var/probe
#       sizeGB: 1

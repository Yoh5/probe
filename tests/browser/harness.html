<!doctype html>
<meta charset="utf-8">
<title>running</title>
<!--
  The interview conducted against a fake AssemblyAI.

  The page is the real one: it is fetched, its markup and styles are installed
  here, and then the real app.js is loaded on top of stubs for the four things a
  test machine has no business having - a websocket, a microphone, an audio
  context and a server. Nothing in app.js knows the difference.

  Time runs SPEED times faster, timers and the clock together, so the ninety
  second answer budget takes under two seconds to expire.

  The result goes in the title, where the runner reads it.
-->
<body>
<script>
const SPEED = 60;
const results = [];
const sent = [];        // every message the page sent to the "agent"
let socket = null;      // the page's agent websocket
let assessCalls = 0;
let lastAsked = null;
let outOfQuestions = false;
let buildingBaseline = false;
const assessed = [];

// -- time ------------------------------------------------------------------------
const realNow = performance.now.bind(performance);
const origin = realNow();
performance.now = () => origin + (realNow() - origin) * SPEED;
const realTimeout = window.setTimeout.bind(window);
const realInterval = window.setInterval.bind(window);
window.setTimeout = (fn, ms, ...rest) => realTimeout(fn, (ms || 0) / SPEED, ...rest);
window.setInterval = (fn, ms, ...rest) => realInterval(fn, Math.max(4, (ms || 0) / SPEED), ...rest);
const wait = (ms) => new Promise((r) => realTimeout(r, ms / SPEED));

// -- the stubs -------------------------------------------------------------------
class FakeSocket {
  constructor(url) {
    this.url = url;
    this.readyState = 1;               // OPEN: nothing here is asynchronous
    if (String(url).includes("agents.assemblyai.com")) socket = this;
    realTimeout(() => this.onopen && this.onopen(), 0);
  }
  send(data) { if (this === socket) sent.push(JSON.parse(data)); }
  close() { this.readyState = 3; }
}
FakeSocket.OPEN = 1;
window.WebSocket = FakeSocket;

const realFetch = window.fetch.bind(window);
window.fetch = async (url, options) => {
  if (!String(url).startsWith("/api/")) return realFetch(url, options);   // the page itself
  const body = options?.body ? JSON.parse(options.body) : null;
  const reply = (value) => ({ ok: true, status: 200, json: async () => value });
  if (url === "/api/interview") {
    return reply({ role: "Tester", parts: 3, languages: [
      { code: "en", name: "English", voice: "alba" }, { code: "fr", name: "Français", voice: "estelle" }] });
  }
  if (url === "/api/session") {
    return reply({ agent_id: "agent-1", agent: "tok-a", streaming: "tok-s", language: "en" });
  }
  if (url === "/api/assess") {
    assessCalls += 1;
    lastAsked = body.asked;
    assessed.push({ words: (body.answer_words || []).length, baseline: body.baseline_words });
    if (buildingBaseline) {
      return reply({ verdict: "baseline", baseline_ready: false, instruction: "Stay on the warm-up.",
                     words: (body.answer_words || []).length, last: false });
    }
    return reply({ verdict: "spontaneous", instruction: "Move the interview forward.",
                   words: (body.answer_words || []).length, last: outOfQuestions });
  }
  return reply({ id: "session-1" });
};

Object.defineProperty(navigator, "mediaDevices", {
  configurable: true,
  value: { getUserMedia: async () => ({ getTracks: () => [{ stop() {} }] }) },
});
class FakePort { postMessage() {} }
const ports = {};
class FakeNode {
  constructor(context, name) { this.port = new FakePort(); ports[name || "node"] = this.port; }
  connect() {} disconnect() {}
}
window.AudioWorkletNode = FakeNode;

// The audio clock the page keeps is driven by how much audio it has SENT, so a
// harness that sends none leaves every answer starting at zero - and an answer
// window that never moves hides exactly the bugs this file is here to catch.
const CHUNK_MS = 1200 / 24000 * 1000;      // the worklet's 1200-sample chunk at 24 kHz
let audioMs = 0;
function speak(ms) {
  const port = ports["pcm-chunker"];
  const chunks = Math.round(ms / CHUNK_MS);
  for (let i = 0; i < chunks; i++) {
    port?.onmessage?.({ data: new Float32Array(1200).fill(0.15) });
    audioMs += CHUNK_MS;
  }
}
window.AudioContext = class {
  constructor() { this.audioWorklet = { addModule: async () => {} }; this.destination = new FakeNode(); }
  createMediaStreamSource() { return new FakeNode(); }
  close() {}
};

// -- assertions ------------------------------------------------------------------
function check(name, condition, detail) {
  results.push({ name, ok: Boolean(condition), detail: condition ? "" : (detail || "") });
}
const lastOfType = (type) => [...sent].reverse().find((m) => m.type === type);
const toolResults = () => sent.filter((m) => m.type === "tool.result");
const agent = (message) => window.handleAgent(message);

// Words arriving on the transcription connection, the way the real one delivers
// them: finalised turns, with timings on the audio clock.
function heard(count) {
  const words = [];
  let at = audioMs;
  for (let i = 0; i < count; i++) {
    words.push({ text: `w${i}`, start: at, end: at + 200, confidence: 0.95 });
    at += 260;
  }
  window.sttHeard(words);
}

// A full agent turn: it says something, then hands the floor over.
function agentSays(text) {
  agent({ type: "reply.started" });
  agent({ type: "transcript.agent", text });
  // The microphone streams throughout, including while the interviewer talks, so
  // the audio clock keeps moving and the next answer starts after this one.
  speak(1200);
  agent({ type: "reply.done", status: "completed" });
}

async function run() {
  // The real page, with its real markup and styles.
  const html = await (await fetch("/static/index.html")).text();
  const parsed = new DOMParser().parseFromString(html, "text/html");
  document.head.append(...parsed.head.querySelectorAll("style"));
  document.body.innerHTML = parsed.body.innerHTML;   // script tags inserted this way do not run
  await new Promise((done) => {
    const tag = document.createElement("script");
    tag.src = "/static/app.js";
    tag.onload = done;
    document.body.append(tag);
  });
  await wait(200 * SPEED);
  [...document.querySelectorAll("#languages button")]
    .find((b) => b.textContent === "English")?.click();

  // 1. It opens.
  document.getElementById("start").click();
  await wait(200 * SPEED);
  agent({ type: "session.ready" });
  await wait(300 * SPEED);
  check("the stored agent is named, never its instructions",
    lastOfType("session.update")?.session?.agent_id === "agent-1", JSON.stringify(sent.slice(0, 2)));
  check("it is told to open the interview itself", Boolean(lastOfType("reply.create")));
  check("the interview screen is showing", !document.getElementById("screen-interview").hidden);
  check("the progress mark has one tick per part",
    document.getElementById("stage-marks").childElementCount === 3);

  // 2. The hang: a cough during the assessment used to strand the tool result
  //    forever, and the interview went silent for good.
  agentSays("So, to start: what did you do yesterday?");
  agent({ type: "input.speech.started" });
  agent({ type: "transcript.user", text: "I got up early and went to the gym." });
  agent({ type: "input.speech.stopped" });
  agent({ type: "tool.call", name: "assess_answer", call_id: "call-1", arguments: { topic_id: "warmup", claim: "gym" } });
  agent({ type: "input.speech.started" });      // the cough, mid-assessment
  await wait(4000);
  check("the tool result is sent even when the candidate makes a noise mid-assessment",
    toolResults().some((m) => m.call_id === "call-1"),
    `sent: ${JSON.stringify(sent.map((m) => m.type))}`);
  check("the assessment ran once for that answer", assessCalls === 1, `ran ${assessCalls} times`);

  // 3. The question on screen is not also repeated in the history below it.
  agentSays("You said you went to the gym - what did you do there?");
  await wait(100);
  const said = document.getElementById("said").textContent;
  const history = document.getElementById("transcript").textContent;
  check("the live question is not repeated in the history",
    said.includes("what did you do there") && !history.includes("what did you do there"),
    `said=${said} history=${history}`);
  check("the earlier exchange is in the history",
    history.includes("what did you do yesterday") && history.includes("went to the gym"));

  // 4. Nobody answers: after five seconds the interview moves itself on.
  const before = sent.length;
  await wait(6000);
  const nudge = sent.slice(before).find((m) => m.type === "reply.create");
  check("five seconds of silence moves the interview on",
    nudge && nudge.instructions.includes("said nothing for five seconds"),
    JSON.stringify(sent.slice(before).map((m) => m.type)));

  // 5. An answer that never ends: the granted time runs out and the turn is taken.
  agentSays("Tell me about a project.");
  agent({ type: "input.speech.started" });      // they are talking, so silence never fires
  const mark = sent.length;
  await wait(8000);
  check("speaking cancels the silence clock",
    !sent.slice(mark).some((m) => m.type === "reply.create" && m.instructions.includes("five seconds")));
  await wait(95000);
  const expiry = sent.slice(mark).find((m) => m.type === "reply.create" && m.instructions.includes("as long as one answer gets"));
  check("the answer budget runs out and the interviewer takes the turn", Boolean(expiry));

  // 6. The clock is shown while the floor is the candidate's, and counts down.
  agentSays("Last one: what would you change?");
  await wait(1200);
  const clock = document.getElementById("clock");
  const shown = clock.hidden === false && /\d/.test(document.getElementById("clock-time").textContent);
  check("the candidate can see how long the answer may run", shown,
    `hidden=${clock.hidden} text=${document.getElementById("clock-time").textContent}`);

  // 6b. A warm-up too short to compare against keeps gathering: what is sent for
  //     assessment grows, instead of the interview settling on a baseline that
  //     makes every later answer unmeasurable.
  buildingBaseline = true;
  const mark2 = assessed.length;
  for (const count of [4, 5]) {
    agentSays("Tell me a bit more.");        // the floor changes hands: a new answer window
    agent({ type: "input.speech.started" });
    speak(2000);                             // two seconds of the candidate talking
    heard(count);
    agent({ type: "input.speech.stopped" });
    agent({ type: "tool.call", name: "assess_answer", call_id: `warm-${count}`, arguments: { topic_id: "warmup", claim: "x" } });
    await wait(4000);
  }
  const built = assessed.slice(mark2);
  check("each answer is measured on its own words, not on the whole interview",
    built.length === 2 && built[0].words === 4, JSON.stringify(built));
  check("a short warm-up keeps gathering instead of settling for too little",
    built.length === 2 && built[1].words === 9 && built.every((a) => a.baseline === null),
    JSON.stringify(built));
  buildingBaseline = false;

  // 7. The interview counts its own questions, and stops when they run out even
  //    if the interviewer would rather ask another.
  check("the page tells the server how many questions have been asked",
    typeof lastAsked === "number" && lastAsked > 0, `asked=${lastAsked}`);

  outOfQuestions = true;
  agentSays("And one more thing?");
  agent({ type: "input.speech.started" });
  agent({ type: "input.speech.stopped" });
  agent({ type: "tool.call", name: "assess_answer", call_id: "call-last", arguments: { topic_id: "depth", claim: "x" } });
  await wait(4000);
  check("the closing instruction reaches the interviewer",
    toolResults().some((m) => m.call_id === "call-last"));
  await wait(30000);        // the interviewer says nothing and never ends it
  check("the page ends the interview itself once the questions are spent",
    document.getElementById("screen-interview").hidden,
    `showing: ${[...document.querySelectorAll(".screen")].filter((s) => !s.hidden).map((s) => s.id)}`);

  const failed = results.filter((r) => !r.ok);
  document.title = failed.length
    ? `FAIL ${failed.length}/${results.length}`
    : `PASS ${results.length}/${results.length}`;
  const report = document.createElement("pre");
  report.id = "report";
  report.textContent = results.map((r) => `${r.ok ? "ok  " : "FAIL"}  ${r.name}${r.detail ? "\n        " + r.detail : ""}`).join("\n");
  document.documentElement.append(report);
}

run().catch((error) => {
  document.title = "ERROR";
  const report = document.createElement("pre");
  report.id = "report";
  report.textContent = `${error.message}\n${error.stack}`;
  document.documentElement.append(report);
});
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Probe">
  <!-- An echo sounder: a pulse sent down, and what comes back. To probe is to
       sound a depth - the oldest meaning of the word, and the whole of what this
       interview does. It reads at sixteen pixels, which the plumb line did not:
       that one turned into a letter T. -->
  <rect width="32" height="32" rx="8" fill="#6A2E5C"/>
  <circle cx="16" cy="9" r="2.7" fill="#fff"/>
  <g stroke="#fff" stroke-width="2.8" stroke-linecap="round" fill="none">
    <path d="M11.2 14.9Q16 20.8 20.8 14.9"/>
    <path d="M6.9 19.2Q16 29.9 25.1 19.2"/>
  </g>
</svg>

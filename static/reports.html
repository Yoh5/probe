<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EAE7E0">
  <title>Interviews - Probe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/static/probe.css">
</head>
<body>
<div class="page wide">
  <header class="nav">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5.8" r="2" fill="currentColor"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8.4 10.2Q12 14.6 15.6 10.2"/><path d="M5.2 13.4Q12 21.4 18.8 13.4"/></g></svg></span>
    <span class="name">Probe</span>
  </header>
  <main>
    <h1>Interviews</h1>

    <section class="card invite-card">
      <p class="invite-head">Invite a candidate</p>
      <p class="meta">One link each, and each link works once: a candidate who could
        take the interview twice could prepare for the second one.</p>
      <form id="invite-form" class="invite-form">
        <label class="sr-only" for="invite-label">Who the invitation is for</label>
        <input id="invite-label" name="label" type="text" autocomplete="off"
               placeholder="Name or reference, for your own list" maxlength="120">
        <button class="go" id="invite-go" type="submit">Create a link</button>
      </form>
      <p class="invite-made" id="invite-made" hidden>
        <code id="invite-url"></code>
        <button class="ghost copy" id="invite-copy" type="button">Copy</button>
      </p>
    </section>

    <h2>Invitations</h2>
    <p class="meta" id="invite-count">Loading</p>
    <div id="invites"></div>

    <h2>Finished interviews</h2>
    <p class="meta" id="count">Loading</p>
    <div id="list"></div>
  </main>
</div>
<script src="/static/reports.js"></script>
</body>
</html>
